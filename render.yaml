services:
  # TRIPORA AI Backend REST API Server
  - type: web
    name: tripora-ai-backend
    env: node
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: '*'
      - key: AI_PROVIDER
        value: GEMINI
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: tripora-ai-postgres
          property: connectionString

databases:
  # Managed PostgreSQL Relational Database
  - name: tripora-ai-postgres
    region: oregon
    plan: starter
    databaseName: tripora_db
    user: tripora_admin
