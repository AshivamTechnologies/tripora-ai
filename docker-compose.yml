version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tripora-postgres
    restart: always
    environment:
      POSTGRES_USER: tripora_admin
      POSTGRES_PASSWORD: tripora_secure_password_2026
      POSTGRES_DB: tripora_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tripora-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tripora-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://tripora_admin:tripora_secure_password_2026@postgres:5432/tripora_db?schema=public
      JWT_SECRET: tripora-production-jwt-secret-docker-2026
      JWT_REFRESH_SECRET: tripora-production-jwt-refresh-secret-docker-2026
      AI_PROVIDER: GEMINI
      CORS_ORIGIN: '*'
    ports:
      - '5000:5000'
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tripora-frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:5000
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
