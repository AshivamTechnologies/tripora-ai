name: TRIPORA AI CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      CI: true
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/tripora_test?schema=public"
      JWT_SECRET: "tripora-ci-super-secret-jwt-key-2026-min-32-chars"
      JWT_REFRESH_SECRET: "tripora-ci-super-secret-refresh-key-2026-min-32"
      AI_PROVIDER: "MOCK"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Generate Prisma client
        working-directory: ./backend
        run: npx prisma generate

      - name: Run backend tests
        working-directory: ./backend
        run: npx vitest run --reporter=verbose

      - name: Compile backend TypeScript
        working-directory: ./backend
        run: npm run build

  frontend-build:
    name: Frontend Compilation & Validation
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: "https://api.tripora.ai"
      NEXT_PUBLIC_APP_URL: "https://tripora.ai"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Next.js Production Build
        run: npm run build
